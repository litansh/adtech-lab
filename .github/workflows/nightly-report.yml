name: Nightly report

# The cold-path jobs, run on a schedule and committed into the repository so
# there is a readable history rather than a log nobody opens.
#
# Both tools report rather than mutate. Nothing here changes a floor or revokes
# a billing record -- it produces the evidence for doing so, and applying it
# stays a separate, deliberate step.
on:
  schedule:
    - cron: '17 3 * * *'   # 03:17 UTC, after the previous day has fully landed
  workflow_dispatch:
    inputs:
      day:
        description: 'Day to analyse (YYYY-MM-DD). Defaults to yesterday.'
        required: false

permissions:
  contents: write     # to commit the report
  id-token: write     # to assume the read-only role

concurrency:
  group: nightly-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_REPORT_ROLE_ARN }}
          aws-region: us-east-1

      - name: fetch the day's events
        id: fetch
        run: |
          day="${{ github.event.inputs.day }}"
          [ -n "$day" ] || day=$(date -u -d yesterday +%Y-%m-%d)
          echo "day=$day" >> "$GITHUB_OUTPUT"
          mkdir -p /tmp/events
          aws s3 cp "s3://adtech-lab-events-${{ secrets.AWS_ACCOUNT_ID }}/events/dt=$day/" /tmp/events/ \
            --recursive --quiet || true
          count=$(find /tmp/events -type f | wc -l | tr -d ' ')
          echo "files=$count" >> "$GITHUB_OUTPUT"
          echo "fetched $count files for $day"

      - name: yield and integrity
        id: run
        if: steps.fetch.outputs.files != '0'
        run: |
          day="${{ steps.fetch.outputs.day }}"
          mkdir -p docs/reports
          out="docs/reports/$day.md"
          {
            echo "# Cold-path report — $day"
            echo
            echo "Generated by \`.github/workflows/nightly-report.yml\`."
            echo "Both tools report only; nothing was applied."
            echo
            echo '## Yield'
            echo
            echo '```'
            for exp in floor_price buyer_tmax; do
              # SHADOW, not propose: the controller records what it WOULD have
              # done and applies nothing. Fourteen of these make the promotion
              # decision a measurement rather than a mood.
              ( cd tools/yieldctl && go run . shadow \
                  --events '/tmp/events/*.ndjson*' --experiment "$exp" \
                  --day "$day" --shadow "../../docs/reports/shadow-$exp.jsonl" \
                  --control-plane ../../services/ad-server/fixtures/control-plane.json \
                ) 2>&1 || echo "  ($exp: no data)"
              echo
            done
            echo '```'
            echo
            echo '## Shadow evaluation'
            echo
            echo '```'
            for exp in floor_price buyer_tmax; do
              ( cd tools/yieldctl && go run . evaluate \
                  --shadow "../../docs/reports/shadow-$exp.jsonl" ) 2>&1 \
                || echo "  ($exp: not enough shadow history yet)"
              echo
            done
            echo '```'
            echo
            echo '## Traffic integrity'
            echo
            echo '```'
            ( cd tools/integrityctl && go run . review --events '/tmp/events/*.ndjson*' ) 2>&1 \
              || echo '  (no data)'
            echo '```'
          } > "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"
          cat "$out"

      - name: commit the report
        if: steps.fetch.outputs.files != '0'
        run: |
          git config user.name  "${{ vars.COMMIT_AUTHOR_NAME || 'github-actions[bot]' }}"
          git config user.email "${{ vars.COMMIT_AUTHOR_EMAIL || '41898282+github-actions[bot]@users.noreply.github.com' }}"
          git add docs/reports/
          if git diff --cached --quiet; then
            echo "no change"; exit 0
          fi
          git commit -m "Cold-path report for ${{ steps.run.outputs.day || steps.fetch.outputs.day }}"
          # Rebase and retry: five workflows commit to main, and two that
          # overlap lose a race. The Orchestrator detected an achievement,
          # committed it, and had the push rejected because the Fleet agent
          # pushed a proposal record a second earlier -- so the work was done,
          # the messages were sent, and the commit evaporated.
          #
          # These are append-only state files written by different agents, so a
          # rebase is always safe here: nothing they touch overlaps.
          for attempt in 1 2 3; do
            git pull --rebase --autostash -q origin main || true
            git push && break
            echo "push rejected, retrying ($attempt)"; sleep 5
          done

      - name: no events
        if: steps.fetch.outputs.files == '0'
        run: echo "No events for that day -- nothing to report. This is expected while the site has no traffic."
