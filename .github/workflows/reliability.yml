name: Reliability

# The only agent whose findings arrive on a phone unprompted, which is exactly
# why it must not report everything. It runs twice a day and says nothing when
# nothing is wrong -- an agent that pages for everything gets muted, and a muted
# reliability agent is the most dangerous object in the system.
on:
  schedule:
    - cron: '0 7,19 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_REPORT_ROLE_ARN }}
          aws-region: us-east-1

      - name: check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: go -C tools/reliabilityctl run . check
