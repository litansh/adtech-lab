<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<style>
  /* Rendered at exactly 1200x630 and screenshotted. Using the browser rather
     than an image library means real typography and the site's own palette --
     the previous generator was stdlib-only Go with no font support, which is
     why the title rendered as a black bar. */
  :root{
    --bg:#EEF0FF; --ink:#23244A; --x:#F2622E; --o:#2BC4AE;
    --red:#E8434F; --yellow:#F5C518; --gold:#FFB627; --frame:#4A4C9B;
    --surface:#FFFFFF; --line:#DDE2FF;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    width:1200px;height:630px;overflow:hidden;
    background:linear-gradient(150deg,#F3F4FF 0%,#E4E8FF 100%);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:var(--ink);
    display:flex;flex-direction:column;justify-content:center;
    padding:0 78px;
  }
  h1{font-size:76px;letter-spacing:-.02em;line-height:1}
  h1 .a{color:var(--x)} h1 .b{color:var(--o)}
  .sub{margin-top:18px;font-size:31px;color:#4A4C9B;line-height:1.35;max-width:840px}
  .badge{
    display:inline-block;margin-bottom:26px;
    background:var(--ink);color:#fff;font-size:22px;font-weight:600;
    letter-spacing:.1em;text-transform:uppercase;
    padding:10px 20px;border-radius:999px;
  }
  .badge b{color:var(--gold)}
  .tiles{display:flex;gap:20px;margin-top:44px}
  .t{
    width:118px;height:118px;background:var(--surface);
    border:3px solid var(--line);border-radius:26px;
    display:grid;place-items:center;
    box-shadow:0 10px 0 rgba(35,36,74,.09);
  }
  .t svg{width:66px;height:66px}
  .foot{
    position:absolute;right:78px;bottom:52px;
    font-size:27px;color:#6B6EA8;font-weight:600;
  }
</style></head>
