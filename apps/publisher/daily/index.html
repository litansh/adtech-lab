<main class="panel">
  <div class="dy-head">
    <a class="dy-arrow" id="dy-prev" href="#" rel="prev" title="Previous day"
       aria-label="Previous day">&#8249;</a>
    <span class="dy-num" id="dy-number">#1</span>
    <span class="dy-title">Daily Sudoku</span>
    <a class="dy-arrow" id="dy-next" href="#" rel="next" title="Next day"
       aria-label="Next day">&#8250;</a>
  </div>

  <p class="dy-archive" id="dy-archive" hidden>
    <span id="dy-archive-date"></span> &middot;
    <a href="/daily">back to today</a>
  </p>

  <div class="tf-stats">
    <div class="sn-stat"><span class="num" id="dy-timer">0:00</span><span class="cap">Time</span></div>
    <div class="sn-stat best"><span class="num" id="dy-streak">0</span><span class="cap">Streak</span></div>
  </div>

  <div class="status" id="dy-status" role="status" aria-live="polite">
    <span id="dy-status-text">One puzzle a day. The same one for everyone.</span>
  </div>

  <div class="sd-wrap">
    <div class="sd-board" id="daily-board" aria-label="Daily Sudoku board"></div>
  </div>

  <div class="sd-pad" id="dy-pad" role="group" aria-label="Numbers">
    <button data-v="1">1</button><button data-v="2">2</button><button data-v="3">3</button>
    <button data-v="4">4</button><button data-v="5">5</button><button data-v="6">6</button>
    <button data-v="7">7</button><button data-v="8">8</button><button data-v="9">9</button>
    <button data-v="0" class="erase" aria-label="Erase">&#9003;</button>
  </div>

  <div class="actions">
    <button class="btn primary" id="dy-share" hidden>Share result</button>
  </div>

  <div class="ad-slot" id="ad-slot" data-placement="game_sidebar" data-game="daily" data-filled="0"></div>
  <p class="ad-label">Advertisement</p>

  <p class="near-miss" id="near-miss" hidden></p>

  <div class="endgame" id="endgame" hidden>
    <div class="ad-slot" id="endgame-slot" data-placement="game_end" data-game="daily" data-filled="0"></div>
    <p class="ad-label">Advertisement</p>
  </div>
</main>
